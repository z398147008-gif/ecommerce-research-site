<title>&#128274;</title>
<style>
:root { --bg:#f5f6f8; --surface:#fff; --ink:#1b2233; --line:#cfd5df; --accent:#27407a; --bad:#a83a32; color-scheme:light; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:center; padding:16px;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
form { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:10px 10px 10px 16px; width:min(340px,100%); box-shadow:0 6px 24px rgba(27,34,51,.08); }
form.bad { border-color:var(--bad); animation:shake .3s; }
@keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
svg { flex:none; }
input { flex:1; min-width:0; border:0; outline:0; font-size:18px; letter-spacing:.15em; background:transparent; color:var(--ink); padding:8px 0; }
button { flex:none; width:44px; height:44px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; }
button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
button[disabled] .go { display:none; } button:not([disabled]) .spin { display:none; }
.spin { animation:rot 0.8s linear infinite; } @keyframes rot { to { transform:rotate(360deg); } }
button.locked { background:var(--bad); } button.locked .spin, button.locked .go { display:none; } button:not(.locked) .no { display:none; }
.wrap { display:flex; flex-direction:column; align-items:center; gap:10px; width:min(340px,100%); }
.msg { min-height:18px; font-size:13px; color:var(--bad); }
</style>
